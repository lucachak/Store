{% load allauth %}
{% if attrs.type == "checkbox" or attrs.type == "radio" %}
<div class="field">
  <div class="check-row">
    <input class="check" type="{{ attrs.type }}" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}>
    <label for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  </div>
  {{ attrs.errors }}
</div>
{% else %}
<div class="field">
  <label class="label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  {% if attrs.type == "textarea" %}
    <textarea class="textarea" {% if attrs.required %}required{% endif %} {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
  {% else %}
    <input class="input" type="{{ attrs.type }}" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
      {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}>
  {% endif %}
  {% if slots.help_text %}<p class="help">{% slot help_text %}{% endslot %}</p>{% endif %}
  {{ attrs.errors }}
</div>
{% endif %}
