{% load static i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="icon" href="{% static 'Img/mark.svg' %}" type="image/svg+xml">
  <link rel="preload" href="{% static 'Fonts/instrument-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% static 'Css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#main">{% trans "Skip to content" %}</a>
  {% block body %}{% endblock %}
  <script src="{% static 'Js/htmx.min.js' %}" defer></script>
  <script src="{% static 'Js/app.js' %}" defer></script>
  {% block extra_body %}{% endblock %}
</body>
</html>
