{% extends "app.html" %}
{% load i18n %}
{% block title %}{% trans "Users" %} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% trans "Users" %}</h1>
  <p>{% trans "Everyone who has an account, with their plan." %}</p>
</div>

<form class="mb-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_14rem]" method="get" role="search"
      hx-get="{% url 'users_list' %}" hx-target="#users" hx-trigger="input changed delay:300ms from:#q, change from:#status" hx-push-url="true">
  <div>
    <label class="label" for="q">{% trans "Search" %}</label>
    <input class="input" id="q" name="q" value="{{ q }}" type="search" placeholder="{% trans 'Name or email' %}" autocomplete="off">
  </div>
  <div>
    <label class="label" for="status">{% trans "Plan status" %}</label>
    <select class="select" id="status" name="status">
      <option value="">{% trans "All" %}</option>
      <option value="none" {% if status == "none" %}selected{% endif %}>{% trans "No plan" %}</option>
      {% for value, label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <noscript><button class="btn btn-ghost" type="submit">{% trans "Apply" %}</button></noscript>
</form>

<div id="users">{% include "Auth/User/_user-table.html" %}</div>
{% endblock %}
